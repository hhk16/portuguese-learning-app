name: Android TV APK
on:
  workflow_dispatch:
  push:
    paths: ["android-tv/**", "scripts/android/**", ".github/workflows/android-tv.yml"]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Capacitor Android project
        working-directory: android-tv
        run: |
          npm install
          npx cap add android
          python3 ../scripts/android/patch-manifest.py android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/drawable
          command -v convert || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)
          convert -size 320x180 gradient:'#3b82f6'-'#ff6b6b' -gravity center -fill white -font DejaVu-Sans-Bold -pointsize 30 -annotate 0 'Party\nPortuguês' android/app/src/main/res/drawable/banner.png
      - name: Build APK
        working-directory: android-tv/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: party-portugues-tv-apk
          path: android-tv/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish to the tv-latest release (direct download link)
        run: |
          cp android-tv/android/app/build/outputs/apk/debug/app-debug.apk party-portugues-tv.apk
          gh release delete tv-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create tv-latest party-portugues-tv.apk --title "Party Português — Android TV" --notes "Latest Android TV build (sideload)." --prerelease --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
