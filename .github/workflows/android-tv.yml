name: Native Android TV
on:
  workflow_dispatch:
  pull_request:
    paths: ['android-tv/**', 'scripts/android/**', 'src/curriculum/**', 'public/audio/**', 'public/art/native-tv/**', 'public/art/characters/**', '.github/workflows/android-tv.yml']
  push:
    branches: ['codex/native-tv-redesign', 'master']
    paths: ['android-tv/**', 'scripts/android/**', 'src/curriculum/**', 'public/audio/**', 'public/art/native-tv/**', 'public/art/characters/**', '.github/workflows/android-tv.yml']
permissions:
  contents: read
concurrency:
  group: native-tv-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Learning state regression checks
        run: |
          mkdir -p /tmp/native-tv-tests
          javac -d /tmp/native-tv-tests android-tv/app/src/main/java/pt/partyportugues/tv/StudySession.java scripts/android/StudySessionTest.java
          java -ea -cp /tmp/native-tv-tests StudySessionTest
          node scripts/android/prepare-native.mjs --check
      - name: Build and lint the native APK
        working-directory: android-tv
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --no-daemon
      - name: Enable hardware acceleration for the TV emulator
        run: sudo chmod a+rw /dev/kvm
      - name: TV remote, offline, Back and restoration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/android/check-tv.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-portugues-tv-${{ github.sha }}
          path: |
            android-tv/app/build/outputs/apk/debug/app-debug.apk
            android-tv/app/build/reports/
            native-tv-screenshots/
          retention-days: 14
          overwrite: true
